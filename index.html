<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>DRIVEWORLD</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Yükleme ekranı -->
    <div id="loading">
        <div class="loading-title">DRIVEWORLD</div>
        <div class="loading-text">Yükleniyor...</div>
    </div>

    <!-- Oyun arayüzü -->
    <div id="game-ui">

        <div class="logo">
            DRIVEWORLD
        </div>

        <div class="speed-box">
            <span id="speed">0</span>
            <small>KM/H</small>
        </div>

    </div>

    <!-- SADECE TELEFON KONTROLLERİ -->
    <div id="mobile-controls">

        <!-- Direksiyon -->
        <div id="steering">

            <button
                id="left"
                class="control-button steering-button"
            >
                ◀
            </button>

            <button
                id="right"
                class="control-button steering-button"
            >
                ▶
            </button>

        </div>

        <!-- Gaz ve fren -->
        <div id="pedals">

            <button
                id="brake"
                class="control-button brake-button"
            >
                FREN
            </button>

            <button
                id="gas"
                class="control-button gas-button"
            >
                GAZ
            </button>

        </div>

    </div>

    <!-- Oyun kodu -->
    <script
        type="module"
        src="script.js">
    </script>

</body>
</html>
