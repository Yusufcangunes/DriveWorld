<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>DriveWorld</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loading">
        <div class="loading-title">DRIVEWORLD</div>
        <div id="loadingText">Dünya hazırlanıyor...</div>
        <div class="loading-bar">
            <div id="loadingProgress"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameUI">

        <div class="logo">
            DRIVEWORLD
        </div>

        <div class="speed-box">
            <span id="speed">0</span>
            <small>KM/H</small>
        </div>

        <div id="mobileControls">

            <div id="steering">
                <button id="leftButton" class="control-button steering-button">
                    ◀
                </button>

                <button id="rightButton" class="control-button steering-button">
                    ▶
                </button>
            </div>

            <div id="pedals">

                <button id="brakeButton"
                        class="control-button brake-button">
                    FREN
                </button>

                <button id="gasButton"
                        class="control-button gas-button">
                    GAZ
                </button>

            </div>

        </div>

    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- GLTF Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

    <script src="script.js"></script>

</body>
</html>
